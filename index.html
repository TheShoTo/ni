<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Little Surprise For You</title>
    <style>
        :root {
            --primary-color: #d63384;
            --secondary-color: #7209b7;
            --bg-color: #fff0f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fixes the mobile dynamic toolbar height issue */
            height: 100dvh; 
            width: 100vw;
            background: linear-gradient(135deg, #ffe4e1 0%, var(--bg-color) 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Floating background elements */
        .bg-heart {
            position: absolute;
            color: rgba(214, 51, 132, 0.15);
            font-size: 1.2rem;
            animation: floatUp 5s linear infinite;
            bottom: -50px;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110dvh) rotate(360deg); opacity: 0; }
        }

        /* Interactive Gift Box */
        #gift-box {
            font-size: 5rem; /* Slightly scaled down for mobile hitboxes */
            cursor: pointer;
            position: absolute;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
            touch-action: none;
        }

        /* Romantic Message Container */
        #message {
            display: none;
            text-align: center;
            z-index: 10;
            width: 100%;
            padding: 0 24px; /* Essential padding for narrow screens */
            animation: romanticFadeIn 1.5s ease-out forwards;
        }

        .heart-main {
            color: #e63946;
            font-size: 4.5rem;
            animation: heartbeat 1.2s infinite cubic-bezier(0.215, 0.610, 0.355, 1);
            filter: drop-shadow(0 0 15px rgba(230, 57, 70, 0.4));
        }

        /* Fluid typography sizes perfect for S22 width */
        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin: 15px 0 8px 0;
            font-weight: normal;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        h2 {
            color: var(--secondary-color);
            font-size: 1.4rem;
            font-style: italic;
            font-weight: 300;
            margin: 0 0 20px 0;
            opacity: 0.95;
            line-height: 1.3;
        }

        p {
            color: #4a4a4a;
            font-size: 1.1rem;
            line-height: 1.5;
            margin: 0;
            word-wrap: break-word;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.12); }
            40% { transform: scale(1.02); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes romanticFadeIn {
            0% { opacity: 0; transform: scale(0.92) translateY(15px); filter: blur(3px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
    </style>
</head>
<body>

    <!-- The jumping box -->
    <div id="gift-box" onclick="jumpBox()">🎁</div>

    <!-- The final romantic message -->
    <div id="message">
        <div class="heart-main">💖 💜</div>
        
        <!-- EDIT YOUR TEXT HERE -->
        <h1>ძალიან მიყვარხარ</h1>
        <h2>ტკბილი ძილი ნინუც (ნი)💋💋✨</h2>
        
        <!-- ------------------- -->
        
    </div>

    <script>
        let clickCount = 0;
        const maxClicks = 5;
        const box = document.getElementById('gift-box');
        const message = document.getElementById('message');

        // Initial centering using precise element offsets
        function centerBox() {
            box.style.left = (window.innerWidth / 2 - box.offsetWidth / 2) + 'px';
            box.style.top = (window.innerHeight / 2 - box.offsetHeight / 2) + 'px';
        }
        
        window.onload = centerBox;

        // Background decorative particles
        function createBgHeart() {
            if (clickCount >= maxClicks) return; // Stop making them once opened to save mobile CPU
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = ['❤️', '💖', '✨', '💕', '🌸'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 90 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's'; 
            document.body.appendChild(heart);
            
            setTimeout(() => { heart.remove(); }, 5000);
        }
        setInterval(createBgHeart, 700);

        function jumpBox() {
            clickCount++;

            if (clickCount >= maxClicks) {
                box.style.display = 'none';
                message.style.display = 'block';
            } else {
                // Strict boundaries to prevent the box from escaping off the edges of an S22 screen
                const boxWidth = box.offsetWidth || 80;
                const boxHeight = box.offsetHeight || 80;
                
                // Keep 40px away from edges (protects against camera cutout and navigation bars)
                const safeWidth = window.innerWidth - boxWidth - 80;
                const safeHeight = window.innerHeight - boxHeight - 80;
                
                const randomX = Math.floor(Math.random() * safeWidth) + 40;
                const randomY = Math.floor(Math.random() * safeHeight) + 40;
                
                box.style.left = randomX + 'px';
                box.style.top = randomY + 'px';
            }
        }
    </script>
</body>
</html>
