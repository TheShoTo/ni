<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; 
            width: 100vw;
            background: linear-gradient(135deg, #ffe4e1 0%, #fff0f5 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .drift {
            position: absolute;
            color: rgba(214, 51, 132, 0.15);
            font-size: 1.2rem;
            animation: flyUp 5s linear infinite;
            bottom: -50px;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110dvh) rotate(360deg); opacity: 0; }
        }

        #box {
            font-size: 5rem; 
            cursor: pointer;
            position: absolute;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
            touch-action: none;
        }

        #card {
            display: none;
            text-align: center;
            z-index: 10;
            width: 100%;
            padding: 0 24px; 
            animation: showMe 1.5s ease-out forwards;
        }

        .main-icon {
            color: #e63946;
            font-size: 4.5rem;
            animation: pulse 1.2s infinite cubic-bezier(0.215, 0.610, 0.355, 1);
            filter: drop-shadow(0 0 15px rgba(230, 57, 70, 0.4));
        }

        h1 {
            color: #d63384;
            font-size: 2.5rem;
            margin: 15px 0 8px 0;
            font-weight: normal;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        h2 {
            color: #7209b7;
            font-size: 1.4rem;
            font-style: italic;
            font-weight: 300;
            margin: 0 0 20px 0;
            opacity: 0.95;
            line-height: 1.3;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            20% { transform: scale(1.12); }
            40% { transform: scale(1.02); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes showMe {
            0% { opacity: 0; transform: scale(0.92) translateY(15px); filter: blur(3px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
    </style>
</head>
<body>

    <div id="box" onclick="moveIt()">🎁</div>

    <div id="card">
        <div class="main-icon">💖 💜</div>
        <h1>ძალიან მიყვარხარ</h1>
        <h2>ტკბილი ძილი ნინუც (ნი)💋💋✨</h2>
    </div>

    <script>
        let taps = 0;
        const target = 5;
        const el = document.getElementById('box');
        const view = document.getElementById('card');

        function setup() {
            el.style.left = (window.innerWidth / 2 - el.offsetWidth / 2) + 'px';
            el.style.top = (window.innerHeight / 2 - el.offsetHeight / 2) + 'px';
        }
        window.onload = setup;

        setInterval(function() {
            if (taps >= target) return;
            const d = document.createElement('div');
            d.classList.add('drift');
            d.innerHTML = ['❤️', '💖', '✨', '💕', '🌸'][Math.floor(Math.random() * 5)];
            d.style.left = Math.random() * 90 + 'vw';
            d.style.animationDuration = (Math.random() * 2 + 3) + 's'; 
            document.body.appendChild(d);
            setTimeout(() => { d.remove(); }, 5000);
        }, 700);

        function moveIt() {
            taps++;
            if (taps >= target) {
                el.style.display = 'none';
                view.style.display = 'block';
            } else {
                const w = el.offsetWidth || 80;
                const h = el.offsetHeight || 80;
                const safeW = window.innerWidth - w - 80;
                const safeH = window.innerHeight - h - 80;
                
                const x = Math.floor(Math.random() * safeW) + 40;
                const y = Math.floor(Math.random() * safeH) + 40;
                
                el.style.left = x + 'px';
                el.style.top = y + 'px';
            }
        }
    </script>
</body>
</html>
